name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:
    inputs:
      update_events:
        description: Refresh events from OSAKA-INFO
        type: boolean
        default: true
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install event importer browser
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.update_events)
        run: npx playwright install --with-deps chromium
      - name: Refresh event data
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.update_events)
        run: npm run update:events
      - run: npm test
      - run: python3 -m unittest discover -s tests -p "test_*.py"
      - run: npm run build
      - name: Save refreshed event data
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.update_events)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/station_events.geojson docs/events-import-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Update OSAKA-INFO events"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
